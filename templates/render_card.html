<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Card render</title>
<style>
    body { margin: 0; background: #ffffff; }
    #card {
        width: 720px;
        box-sizing: border-box;
        padding: 28px 32px;
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 19px;
        line-height: 1.55;
        color: #1a1a1a;
        overflow-wrap: break-word;
    }
    #card p:first-child { margin-top: 0; }
    #card p:last-child { margin-bottom: 0; }
    #card pre {
        background: #f4f4f5;
        border-radius: 8px;
        padding: 12px 14px;
        white-space: pre-wrap;
        word-break: break-word;
    }
    #card code {
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        background: #f4f4f5;
        padding: 1px 5px;
        border-radius: 4px;
    }
    #card pre code { background: none; padding: 0; }
    #card img { max-width: 100%; }
    #card mjx-container[display="true"] { margin: 14px 0; }
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<!-- The MathJax bundle is fetched below, and only for cards that actually
     contain math — it used to block this page's load on every render. -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
</head>
<body>
<div id="card"></div>
<script>
window.addEventListener('DOMContentLoaded', function () {
    const raw = {{ content | tojson }};
    // Keep in sync with layout.html's renderMarkdownSafely: markdown emphasis
    // corrupts LaTeX (underscores in math become <em> tags), so math segments
    // are hidden behind placeholder tokens while marked runs, then restored
    // (HTML-escaped) for MathJax. Code segments stay with marked; MathJax
    // skips <pre>/<code> on its own.
    const MATH_SEGMENT = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|(?<!\\)\$[^$\n]+?\$/g;
    const CODE_SEGMENT = /(```[\s\S]*?```|`[^`\n]*`)/;
    const escapeHtml = function (s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
    const stash = [];
    const masked = raw.split(CODE_SEGMENT).map(function (part, i) {
        if (i % 2 === 1) return part;  // code segment: marked renders it as-is
        return part.replace(MATH_SEGMENT, function (math) {
            stash.push(math);
            return '\uE000' + (stash.length - 1) + '\uE001';
        });
    }).join('');
    const card = document.getElementById('card');
    card.innerHTML = DOMPurify.sanitize(marked.parse(masked), {
        ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'u', 's', 'code', 'pre', 'blockquote',
                      'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                      'a', 'img', 'table', 'thead', 'tbody', 'tr', 'th', 'td',
                      'span', 'div', 'hr', 'sup', 'sub'],
        ALLOWED_ATTR: ['href', 'src', 'alt', 'title', 'class', 'id', 'target', 'rel'],
        ALLOW_DATA_ATTR: false
    }).replace(/\uE000(\d+)\uE001/g, function (_, i) {
        return escapeHtml(stash[Number(i)]);
    });
    // The screenshot function waits for this flag, so every path has to set it
    // — a botched typeset still beats a timeout.
    const ready = function () { window.__RENDER_READY__ = true; };

    // `stash` covers delimited math. A LaTeX environment needs no delimiters
    // — MathJax's processEnvironments is on by default — and the masking pass
    // deliberately doesn't stash it, so it has to be tested separately. This
    // is exactly the content needs_screenshot() routes here for: without the
    // second test, \begin{pmatrix}... was screenshotted as raw source. Keep in
    // sync with layout.html's MATH_ENVIRONMENT.
    const MATH_ENVIRONMENT = /\\begin\{[a-zA-Z*]+\}/;
    if (!stash.length && !MATH_ENVIRONMENT.test(raw)) return ready();

    const mathJax = document.createElement('script');
    mathJax.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';
    mathJax.onload = function () {
        // A bundle that 200s without initializing (captive portal, proxy) still
        // fires load, and window.MathJax is then just the config object above —
        // so .startup.promise is undefined and .then() would throw right here,
        // leaving __RENDER_READY__ unset and the screenshot to time out.
        Promise.resolve()
            .then(function () { return MathJax.startup.promise; })
            .then(function () { return MathJax.typesetPromise([card]); })
            .catch(function (error) { console.warn('MathJax typesetting failed:', error); })
            .then(ready);
    };
    mathJax.onerror = function () {
        console.warn('MathJax bundle failed to load; screenshotting without it');
        ready();
    };
    document.head.appendChild(mathJax);
});
</script>
</body>
</html>
